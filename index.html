<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Manage your study tasks easily</p>
    </header>


    <main>

        <section id="add-task-section">

            <h2>Add New Task</h2>

            <form id="task-form">

                <input
                    type="text"
                    id="task-title"
                    placeholder="Enter task title"
                    required
                >

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Search and Filter Section -->
        <section id="filter-section">

            <h2>My Tasks</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Search tasks..."
            >

            <div id="filter-buttons">

                <button id="all-btn">
                    All
                </button>

                <button id="pending-btn">
                    Pending
                </button>

                <button id="completed-btn">
                    Completed
                </button>

            </div>

        </section>


        <!-- Status Message -->
        <p id="status-message">
            Loading tasks...
        </p>


        <!-- Task List -->
        <section id="task-section">

            <div id="task-list">
                <!-- Tasks will be displayed here using JavaScript -->
            </div>

        </section>

    </main>


    <footer>
        <p>Student Task Manager</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
